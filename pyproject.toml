[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"api/_lib/demo.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["api"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["api/_lib"]
