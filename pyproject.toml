[project]
name = "job-application-tracker"
version = "0.1.0"
description = "Live job application tracker: reads Gmail and shows the status of every application"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel installs from here, Docker and CI from requirements*.txt)
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.27.2",
    "cryptography==43.0.3",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"api/_lib/demo.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["api"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["api/_lib"]
